<!doctype html>
<html lang="en">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link rel="preconnect" href="https://fonts.googleapis.com">

<body>
  <div id="app">
    <canvas id="gl" tabindex="0"></canvas>
    <div id="annot"></div>
    <div id="ui"></div>
  </div>
  <script type="module" src="./ui-test.js"></script>
</body>
</html>
